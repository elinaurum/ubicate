name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Pruebas
        run: pytest --cov=ubicate --cov-report=term-missing
      - name: Integridad de datos
        run: python scripts/validar_datos.py --estricto
